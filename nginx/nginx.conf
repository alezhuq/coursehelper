# Per-IP abuse control for the unauthenticated magic-link request endpoint
# (this file is included inside nginx's http context, so the zone directive
# is valid here). The API also enforces a per-email resend interval; this
# zone stops a single client looping the endpoint across many emails.
limit_req_zone $binary_remote_addr zone=magiclink:10m rate=6r/m;

server {
    listen 80;
    server_name _;

    # Raised from nginx's 1 MB default to accept the ~300 MB PDF upload cap
    # plus headroom for multipart boundary/header overhead (310,
    # not 300). This is the outer DoS guard; the api's own streaming read
    # loop (app/books/storage.py) is the authoritative business-rule check.
    client_max_body_size 310m;

    root /usr/share/nginx/html;
    index index.html;

    # react-pdf's pdf.js worker ships as an ESM `.mjs`
    # asset. nginx's stock mime.types has no `.mjs` entry, so without this
    # override it falls through to `application/octet-stream` and the
    # browser's strict MIME-type check for module scripts refuses to
    # execute it - the PDF viewer fails with "Setting up fake worker" /
    # "Could not load this PDF" even though the file itself served 200 OK.
    # Must come before the `location /` prefix match below: nginx checks
    # regex locations after the longest prefix match and uses this one
    # instead whenever it matches.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths (e.g. /login, /admin) serve
    # index.html so React Router handles client-side routing.
    location / {
        try_files $uri /index.html;
    }

    # Throttled: unauthenticated endpoint that triggers outbound email.
    # burst absorbs a legitimate double-click; anything past it gets 429.
    location = /api/auth/magic-link/request {
        limit_req zone=magiclink burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000/auth/magic-link/request;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Reverse proxy to the api service. proxy_buffering off and the long
    # read timeout let SSE chat streaming pass through unbuffered.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        # Stream the request body straight through to the api instead of
        # buffering an up-to-300 MB upload to nginx's own disk first.
        proxy_request_buffering off;
    }
}
