[project]
name = "student-course-library-api"
version = "0.1.0"
description = "FastAPI backend for the Student Course Library"
requires-python = ">=3.12"
dependencies = [
    # fastapi.sse.EventSourceResponse (native SSE) only exists from 0.135.0
    # onward - required by app/chat/routes.py. Lower
    # bound bumped from >=0.115; upper bound unchanged.
    "fastapi[standard]>=0.135,<0.140",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29",
    # Migrations run on a sync psycopg engine (see db/migrations/env.py) so
    # multi-statement scripts like procrastinate's schema.sql work; asyncpg
    # always executes via prepared statements, which reject those.
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27",
    "procrastinate>=3.9,<4.0",
    "itsdangerous>=2.2",
    # Pinned exactly: low-download package, manually reviewed at 1.7.2.
    # Bump only after re-verifying the PyPI project and source repo.
    "python-cas==1.7.2",
    # ML/ingestion stack: bounded ranges, not exact pins. Docling in particular ships weekly releases, so
    # re-verify the exact range against PyPI before bumping either bound.
    "docling>=2.100,<3.0",
    "docling-core>=2.80,<3.0",
    "rapidocr-onnxruntime>=1.4,<2.0",
    "sentence-transformers>=5.0,<6.0",
    "pgvector>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.6",
    # Generate born-digital and scanned-image PDF test fixtures for the
    # ingestion pipeline.
    "reportlab>=4.0",
    "pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query()/Cookie() in argument defaults is the
# idiomatic dependency-injection pattern, not the mutable-default footgun
# this rule targets elsewhere.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Every async test in a session shares one event loop, matching the
# lifetime of the session-scoped `postgres_container` fixture and the
# lazily-built async engine in app/db/base.py: a per-test event loop (the
# default) would bind the engine's connections to the first test's loop and
# then fail with "attached to a different loop" on every subsequent test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
